

<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ffe29f, #ffa99f);
}

h1 {
    font-size: 35px;
    margin-top: 40px;
}

.box {
    background: white;
    padding: 30px;
    margin: 50px auto;
    width: 300px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 15px 0;
    font-size: 20px;
    border-radius: 10px;
    border: none;
    color: white;
    cursor: pointer;
}

.btn1 { background: #ff7f50; }
.btn2 { background: #6a5acd; }
.btn3 { background: #20b2aa; }

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>🎨 Farbenspiele</h1>

<div class="box">

<button class="btn1" onclick="location.href='color.html'">
🎨 Farbenspiel
</button>

<button class="btn2" onclick="location.href='rainbow.html'">
🌈 Regenbogen Spiel
</button>

<button class="btn3" onclick="location.href='mix.html'">
🧪 Farben mischen
</button>

</div>

<br>
<a href="dashboard.html">⬅ Zurück</a>

</body>
</html>
