<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 20px;
            /* Optimierung für Kinder-Apps */
            user-select: none;
            touch-action: manipulation;
            min-height: 100vh;
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-top: 20px;
        }

        .profile {
            margin: 20px;
        }

        .profile img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            object-fit: cover; /* Sorgt dafür, dass das Bild nicht verzerrt */
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .menu a {
            display: block;
            width: 80%;
            max-width: 300px;
            padding: 15px;
            font-size: 20px;
            text-decoration: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 4px rgba(0,0,0,0.2);
        }

        .math { background: #4CAF50; }
        .colors { background: #ff9800; }
        .days { background: #2196F3; }
        .months { background: #9C27B0; }
        .logout { background: #f44336; }

        .menu a:active {
            transform: scale(0.95);
            box-shadow: 0 2px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <h1 id="begruessung">Hallo! 👋</h1>

    <div class="profile">
        <img id="profilBild" src="default.png" alt="Profilbild">
    </div>

    <div class="menu">
        <a href="games.html" class="math">➕➖ Mathe Spiel</a>
        <a href="colors.html" class="colors">🎨 Farben</a>
        <a href="days.html" class="days">📅 Tage</a>
        <a href="months.html" class="months">📆 Monate</a>
        <a href="planeten.html" class="days">🪐 Planeten</a>
        <a href="#" onclick="logout()" class="logout">🚪 Abmelden</a>
    </div>

    <script>
        // Beim Laden der Seite die Daten aus dem Speicher holen
        window.onload = function() {
            const name = localStorage.getItem('kindName');
            const photo = localStorage.getItem('kindPhoto');

            // Prüfen, ob das Kind eingeloggt ist
            if (!name) {
                window.location.href = "login.html";
                return;
            }

            // Die Seite mit den Daten füllen
            document.getElementById('begruessung').innerText = "Hallo " + name + " 👋";
            
            // Falls das Bild im Ordner "uploads" liegt, passen wir den Pfad an
            if (photo) {
                document.getElementById('profilBild').src = "uploads/" + photo;
            }
        };

        function logout() {
            // Daten löschen und zurück zum Login
            localStorage.removeItem('kindName');
            localStorage.removeItem('kindPhoto');
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
